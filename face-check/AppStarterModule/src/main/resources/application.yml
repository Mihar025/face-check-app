spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
      accept-single-value-as-array: true
    time-zone: America/New_York
    date-format: com.fasterxml.jackson.databind.util.StdDateFormat
  mvc:
    throw-exception-if-no-handler-found: true
    dispatch-options-request: false
  web:
    resources:
      add-mappings: false
  profiles:
    active: prod
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:1MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:1MB}
      resolve-lazily: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:/db/migration}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: ${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:true}
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER:false}

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api/v1}
  port: ${SERVER_PORT:8088}
  address: ${SERVER_ADDRESS:0.0.0.0}
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    path: /error
  tomcat:
    max-swallow-size: 1MB
    max-http-form-post-size: 1MB
    max-http-header-size: 8KB
    connection-timeout: 5000
  max-http-request-header-size: 8KB

security:
  require-ssl: ${SECURITY_REQUIRE_SSL:false}
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

tax:
  rates:
    social-security: 0.062
    medicare: 0.0145
    futa: 0.06
    ny-unemployment: 0.041

app:
  crypto:
    aesKeyBase64: ${APP_CRYPTO_AES_KEY_BASE64}
    hmacKeyBase64: ${APP_CRYPTO_HMAC_KEY_BASE64}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}

aws:
  access:
    key:
      id: ${AWS_ACCESS_KEY_ID:}
    secret:
      key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    region: ${AWS_REGION:us-east-2}
    bucket: ${AWS_S3_BUCKET:face-check-punch-in-out-photos}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  success-url: ${STRIPE_SUCCESS_URL}
  cancel-url: ${STRIPE_CANCEL_URL}
  base-price-id: price_FACE_BASE_15

alerts:
  email:
    to: ${ALERTS_EMAIL_TO:}
    enabled: ${ALERTS_EMAIL_ENABLED:true}

application:
  security:
    jwt:
      secret-key: ${APPLICATION_SECURITY_JWT_SECRET_KEY:}
      expiation: ${APPLICATION_SECURITY_JWT_EXPIATION_MS:36000000}
    encryption:
      aes-key: ${APPLICATION_ENCRYPTION_AES_KEY:}
  mailing:
    frontend:
      activation-url: ${APPLICATION_MAILING_FRONTEND_ACTIVATION_URL:http://localhost:4200/activate-account}
