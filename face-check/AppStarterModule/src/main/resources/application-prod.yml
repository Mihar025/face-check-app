server:
  port: ${SERVER_PORT:8088}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Оптимизация для Neon serverless - не держим постоянные соединения
      minimum-idle: 0
      maximum-pool-size: 2
      idle-timeout: 30000
      max-lifetime: 60000
      keepalive-time: 0
      connection-timeout: 30000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    # Отключаем Open-in-View для более коротких транзакций
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Отключаем постоянную проверку БД в health check
management:
  health:
    db:
      enabled: false