# Основная конфигурация Alertmanager
global:
  # SMTP настройки для Gmail
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'mishamay583@gmail.com'  # Замени на свой email
  smtp_auth_username: 'mishamay583@gmail.com'  # Замени на свой email
  smtp_auth_password: 'wwex oisw bwnc uuvy'  # App Password (НЕ обычный пароль!)
  smtp_require_tls: true

receivers:
  - name: 'critical-alerts'
    email_configs:
      - to: 'mishamay583@gmail.com'
        send_resolved: true
        headers:
          Subject: '🚨 CRITICAL: {{ .GroupLabels.alertname }} - FaceCheck Production'
        html: |
          <!DOCTYPE html>
          <html>
          <body>
            <h2>🚨 Critical Alert</h2>
            <p><b>Alert Name:</b> {{ .GroupLabels.alertname | default "Unknown" }}</p>
            <p><b>Severity:</b> {{ .CommonLabels.severity | default "Unknown" }}</p>
          
            <h3>Affected Instances:</h3>
            <ul>
            {{ range .Alerts }}
              <li>
                <b>Instance:</b> {{ .Labels.instance | default "N/A" }}<br>
                <b>Status:</b> {{ .Status }}<br>
                <b>Started:</b> {{ .StartsAt.Format "2006-01-02 15:04:05" }}<br>
                {{ if .Annotations.summary }}
                <b>Summary:</b> {{ .Annotations.summary }}<br>
                {{ end }}
                {{ if .Annotations.description }}
                <b>Description:</b> {{ .Annotations.description }}<br>
                {{ end }}
                {{ if .GeneratorURL }}
                <a href="{{ .GeneratorURL }}">View in Prometheus</a>
                {{ end }}
              </li>
            {{ end }}
            </ul>
          </body>
          </html>

  - name: 'warning-alerts'
    email_configs:
      - to: 'mishamay583@gmail.com'
        send_resolved: true
        headers:
          Subject: '⚠️ WARNING: {{ .GroupLabels.alertname | default "Alert" }}'

  - name: 'business-alerts'
    email_configs:
      - to: 'mishamay583@gmail.com'  # Исправлен email
        send_resolved: true
        headers:
          Subject: '📊 Business Alert: {{ .GroupLabels.alertname | default "Business Issue" }}'

# Настройка маршрутизации алертов
route:
  # Группировка алертов
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  # Дефолтный получатель
  receiver: 'warning-alerts'

  # Маршруты для разных типов алертов
  routes:
    # Критические алерты - сразу отправляем
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h

    # Бизнес алерты
    - match:
        team: business
      receiver: 'business-alerts'
      group_wait: 5m
      repeat_interval: 6h

    # Security алерты
    - match:
        team: security
      receiver: 'critical-alerts'
      group_wait: 10s

# Подавление дублирующихся алертов
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']