global:
  scrape_interval: 15s
  evaluation_interval: 15s  # Как часто проверять правила алертов

# Подключение Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093  # Адрес Alertmanager в Docker

# Загрузка правил алертов
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'facecheck-app'
    metrics_path: '/api/v1/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8088']