groups:
  - name: critical_alerts
    interval: 30s
    rules:
      # Алерт на высокое использование памяти
      - alert: HighMemoryUsage
        expr: jvm_memory_heap_percentage_percent > 85
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}% (threshold 85%)"

      # Алерт на недоступность базы данных
      - alert: DatabaseDown
        expr: database_health < 1
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Database is down"
          description: "Database health check failed for more than 1 minute"

      # Алерт на deadlock потоков
      - alert: ThreadDeadlock
        expr: jvm_threads_deadlocked > 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Thread deadlock detected"
          description: "{{ $value }} threads are deadlocked"

      # Алерт на исчерпание пула соединений БД
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          (
            hikaricp_connections_active{pool="HikariPool-1"} / hikaricp_connections_max{pool="HikariPool-1"}
          ) > 0.9
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Database connection pool almost exhausted"
          description: "Connection pool usage is {{ $value | humanizePercentage }}"

  - name: infrastructure_alerts
    interval: 30s
    rules:
      # Алерт на недоступность сервиса
      - alert: ServiceDown
        expr: up{job="facecheck-app"} == 0
        for: 1m
        labels:
          severity: critical
          team: devops
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.instance }} has been down for more than 1 minute"

      # Алерт на высокую нагрузку CPU
      - alert: HighCPUUsage
        expr: process_cpu_usage > 0.8
        for: 10m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value | humanizePercentage }}"

      # Алерт на высокую нагрузку JVM CPU
      - alert: HighJVMCPUUsage
        expr: jvm_threads_cpu_percentage_seconds > 80
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High JVM CPU usage"
          description: "JVM CPU usage is {{ $value }}%"

