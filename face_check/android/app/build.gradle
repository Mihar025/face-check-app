// android/app/build.gradle (GROOVY)
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace "com.example.face_check"

    compileSdk 36

    defaultConfig {
        applicationId "com.example.face_check"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true  // Добавьте эту строку
    }

    compileOptions {
        coreLibraryDesugaringEnabled true  // Добавьте эту строку
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            // временно подпишем дебаг-ключом, чтобы просто собрать
            signingConfig signingConfigs.debug

            // В Groovy — БЕЗ префикса "is"
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'  // Добавьте эту строку
}